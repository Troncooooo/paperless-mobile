name: Build Release APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: assembleRelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (fvm-pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Provision CI release keystore
        env:
          CPS: paperless-ci-storepass-2026
          KS_B64: ${{ secrets.CI_KEYSTORE_B64 }}
        run: |
          cd android/app
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > ci-release.keystore
            echo "Using repository secret keystore (stable app identity)"
          elif [ -f ../../signing/ci-release.keystore ]; then
            cp ../../signing/ci-release.keystore ci-release.keystore
            echo "Using canonical repo keystore (stable app identity)"
          else
            keytool -genkeypair -v -keystore ci-release.keystore \
              -alias paperless-mobile-ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CPS" -keypass "$CPS" \
              -dname "CN=Paperless Mobile CI, OU=Mobile, O=Troncooooo, L=Amsterdam, C=NL"
            echo "Generated ephemeral keystore (add signing/ci-release.keystore for stable signing)"
          fi
          printf 'storeFile=ci-release.keystore\nkeyAlias=paperless-mobile-ci\nstorePassword=%s\nkeyPassword=%s\n' "$CPS" "$CPS" > ../key.properties

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (freezed / json_serializable / flutter_gen)
        run: dart run build_runner build

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK + keystore artifact
        uses: actions/upload-artifact@v6
        with:
          name: paperless-mobile-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android/app/ci-release.keystore
            android/key.properties
          retention-days: 90
