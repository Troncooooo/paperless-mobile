# Gemini PR checker — free-tier, key-rotating, non-blocking.
#
# Setup (5 min):
#   1. In your repo: Settings → Secrets and variables → Actions → New repo secret:
#        GEMINI_API_KEYS  = "KEY1, KEY2, ..."   (free-tier keys, comma separated)
#      A key from ONE Google account is enough to start; add more accounts'
#      keys to this ONE secret to spread the free-tier rate limits.
#   2. Copy this file to .github/workflows/.
#
# Behavior:
#   - Runs on pull_request (open + synchronize) and optionally pull_request_target.
#   - NON-BLOCKING: it only *comments*; the check never fails CI (always exits 0).
#   - Rate-limit aware: rotates across all keys in GEMINI_API_KEYS on 429/403 and
#     degrades gracefully to a polite note when every key is exhausted.
#
# NOTE: uses plain `pull_request` so the runner never executes PR code with
# secret access (secrets are only provided for same-repo PRs; fork PRs are
# skipped by the guard below). It checks out the trusted base branch and only
# *fetches* the PR head to compute a read-only diff.

name: gemini-pr-checker

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write   # needed to post the review comment
  contents: read

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repo PRs only (secret-bearing). Fork PRs: no secret, no run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out BASE (not the PR head)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}   # only the trusted base branch
          fetch-depth: 0

      - name: Fetch the PR head (read-only)
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          git fetch origin ${{ github.base_ref }}
        shell: bash

      - name: Build review diff (merge-base, read-only)
        id: diff
        run: |
          git diff --no-color origin/${{ github.base_ref }}...FETCH_HEAD > pr.diff
          echo "pr.diff lines: $(wc -l < pr.diff)"
        shell: bash

      - name: Run Gemini review
        id: review
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-flash-latest
        run: |
          set +e
          python3 .github/workflows/gemini_review.py --diff pr.diff > review.md 2>review.err
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "gemini not available / rate-limited; posting a note."
            printf '> ℹ️ Gemini PR-checker was unavailable (rate limit or no keys). No review produced.\n' > review.md
          fi
          echo "done"
        shell: bash

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🦪 Gemini PR review (free-tier)"
            echo ""
            cat review.md
            echo ""
            echo "<sub>Generated by `gemini-pr-checker` · model \`${{ env.GEMINI_MODEL || 'gemini-flash-latest' }}\` · non-blocking</sub>"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        shell: bash
